version: "3.9"

services:

  gateway:
    image: python:3.12-slim
    container_name: akcevision-gateway
    working_dir: /app
    command: tail -f /dev/null
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./apps/gateway:/app

  postgres:
    image: postgres:16
    container_name: akcevision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: akcevision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
